name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'

env:
  SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
  SUPABASE_TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
        name: TypeScript type check

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_schema_drift.py
        name: Check frontend references have backing migrations

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Vitest
        run: npm run test:unit -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  database-tests:
    name: Migrations Apply Clean
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_avenize
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply Supabase compatibility shim
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d test_avenize -v ON_ERROR_STOP=1 -f tests/database/ci_shim.sql
      - name: Apply every migration and report baseline failures
        env:
          PGPASSWORD: postgres
        continue-on-error: true
        run: |
          applied=0; failed=0; failed_list=""
          for migration in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::Applying $(basename "$migration")"
            if psql -h localhost -U postgres -d test_avenize -v ON_ERROR_STOP=1 -f "$migration" 2>&1; then
              applied=$((applied+1))
            else
              echo "::warning::Migration FAILED: $(basename "$migration")"
              failed=$((failed+1))
              failed_list="$failed_list $(basename "$migration")"
            fi
            echo "::endgroup::"
          done
          echo "Applied: $applied, Failed: $failed"
          echo "Failed migrations:$failed_list"
          echo "::notice::Historical migration failures are tracked separately; newly authored migrations must be made clean before release."
      - name: Assert schema is queryable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_avenize -v ON_ERROR_STOP=1 -c "SELECT count(*) AS businesses FROM businesses; SELECT count(*) AS staff FROM staff; SELECT count(*) AS migrations FROM supabase_migrations.schema_migrations;"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, database-tests, schema-drift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  nightly-e2e:
    name: Nightly E2E (Full Suite)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run full Playwright suite
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 30
