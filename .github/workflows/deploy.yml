name: Deploy to Vercel

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Build: $(date -u +%Y%m%d%H%M%S) $GITHUB_SHA" > src/build-info.txt
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Deploy to Vercel Preview
        run: |
          npm i -g vercel
          vercel --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout the exact CI-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Build: $(date -u +%Y%m%d%H%M%S) $GITHUB_SHA" > src/build-info.txt
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel
        run: |
          npm i -g vercel
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # A frontend deployment is NOT "successful" because Vercel built it.
      # The production contract check actually calls the live Supabase and
      # fails the deploy job if any frontend-referenced table/RPC is missing
      # or drifted, or the payment/email edge functions are not deployed.
      - name: Production contract verification
        run: bash scripts/verify-production.sh
        env:
          APP_URL: https://avenize.riverwayse.com

      # Phase 6: journey-level smoke. verify-production.sh checks that OBJECTS
      # exist; this checks the real journeys behave (signup -> onboarding ->
      # membership -> intelligence -> payment rails -> email rail -> frontend).
      # Runs even when the contract gate failed so both reports are visible in
      # the same run; its own exit code also fails the job.
      - name: Production E2E journey test
        if: always()
        run: bash scripts/e2e-production.sh
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL: https://avenize.riverwayse.com

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-contract-report
          path: supabase/contract/verification_report.json
          if-no-files-found: warn

      # Automated post-deploy rollback (opt-in). When a gate above FAILED after
      # the Vercel deploy, roll production back to the previous deployment
      # instead of leaving a contract-violating build live. Disabled by
      # default — enable by setting the repo variable VERCEL_AUTO_ROLLBACK=true.
      # It is deliberately opt-in: while the live DB is behind the migration
      # chain the contract gate fails for database reasons, and unconditional
      # auto-rollback would roll back good frontend deploys in a loop.
      - name: Rollback Vercel on gate failure (opt-in)
        if: failure() && vars.VERCEL_AUTO_ROLLBACK == 'true'
        run: |
          npm i -g vercel
          vercel rollback --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
