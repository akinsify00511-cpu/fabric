name: Deploy to Vercel

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI", "Avenize Control Plane"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Previews are opt-in now. Add the `preview` label to a PR when a
    # deployable preview is actually needed. This prevents every PR push from
    # creating another retained Vercel deployment.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          echo "Build: $(date -u +%Y%m%d%H%M%S) $GITHUB_SHA" > src/build-info.txt
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIT_SHA: ${{ github.sha }}
      - name: Deploy to Vercel Preview
        run: |
          npm i -g vercel
          vercel --yes --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Require CI and Control Plane success for exact SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = ['CI', 'Avenize Control Plane'];
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 100,
            });
            const status = Object.fromEntries(required.map(name => [name, null]));
            for (const run of runs) {
              if (required.includes(run.name) && status[run.name] === null) {
                status[run.name] = run.conclusion;
              }
            }
            const missing = required.filter(name => status[name] !== 'success');
            core.info(`Gate SHA: ${sha}`);
            core.info(`Gate results: ${JSON.stringify(status)}`);
            if (missing.length) {
              core.setFailed(`Production deployment blocked for ${sha}: ${missing.join(', ')} did not pass.`);
            }

      - name: Checkout the exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Build: $(date -u +%Y%m%d%H%M%S) $GITHUB_SHA" > src/build-info.txt
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Vercel
        run: |
          npm i -g vercel
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Hydrate production verification environment from Vercel
        shell: bash
        run: |
          set -euo pipefail
          npm i -g vercel
          rm -rf .vercel
          vercel link --yes --project="${VERCEL_PROJECT_ID}" --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"
          vercel env pull .env.production.local --environment=production --yes --token="${VERCEL_TOKEN}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.env.production.local')
          wanted = {
              'VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'SUPABASE_URL',
              'SUPABASE_KEY', 'SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY',
              'E2E_EMAIL', 'E2E_PASSWORD', 'APP_URL',
          }
          values = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key not in wanted:
                  continue
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              values[key] = value
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  if value:
                      print(f'::add-mask::{value}')
                      out.write(f'{key}={value}\n')
          print('Production verification environment hydrated from Vercel configuration.')
          PY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Production contract verification
        run: bash scripts/verify-production.sh

      - name: Production E2E journey test
        if: always()
        run: bash scripts/e2e-production.sh

      - name: Unified live certification
        if: always()
        run: python3 scripts/governance/production_certification.py
        env:
          REQUIRE_LIVE: '1'

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-contract-report
          path: |
            supabase/contract/verification_report.json
            governance/reports/production-certification.json
          if-no-files-found: warn

      - name: Rollback Vercel on gate failure (opt-in)
        if: failure() && vars.VERCEL_AUTO_ROLLBACK == 'true'
        run: |
          npm i -g vercel
          vercel rollback --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
