name: One-time Upgrade CTA Repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact CTA source
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/components/Shell.tsx').read_text()
          if 'href="/pricing"' not in s:
              raise SystemExit('Upgrade CTA does not point to /pricing')
          if s.count('href="/upgrade"') != 0:
              raise SystemExit('Unexpected /upgrade href remains in Shell.tsx')
          print('Upgrade CTA source verified: /pricing')
          PY
      - name: TypeScript and production build
        run: |
          npm ci
          npm run build
