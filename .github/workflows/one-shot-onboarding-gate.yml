name: one-shot onboarding gate wiring

on:
  push:
    branches: [fix/onboarding-gate-live]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire OnboardingGate into router
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          text = p.read_text()

          import_anchor = "import { KeyboardShortcutsModal } from './components/KeyboardShortcuts'\n"
          gate_import = "import OnboardingGate from './components/OnboardingGate'\n"
          if gate_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found; refusing a blind edit')
              text = text.replace(import_anchor, import_anchor + gate_import, 1)

          old_route = '<Route path="/onboarding" element={<RequireSession><Onboarding /></RequireSession>} />'
          new_route = '<Route path="/onboarding" element={<OnboardingGate><Onboarding /></OnboardingGate>} />'
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit('Onboarding route not found in expected form; refusing a blind edit')

          p.write_text(text)
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -n "OnboardingGate" src/App.tsx
          test -f src/components/OnboardingGate.tsx

      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-onboarding-gate.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/OnboardingGate.tsx
          git commit -m "fix(onboarding): gate wizard on resolved staff state"
          git push
