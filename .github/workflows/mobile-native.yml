name: Avenize Native Mobile Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-native:
    name: Materialize and verify Capacitor Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and reconcile lockfile
        run: npm install --ignore-scripts

      - name: Build web production artifact
        run: npm run build

      - name: Generate Android native project
        run: if [ ! -d android ]; then npx cap add android; fi

      - name: Generate iOS native project
        run: if [ ! -d ios ]; then npx cap add ios; fi

      - name: Sync Capacitor platforms
        run: npx cap sync

      - name: Validate Capacitor configuration
        run: |
          npx cap ls
          test -f capacitor.config.ts
          test -f android/app/src/main/AndroidManifest.xml
          test -f ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.avenize.app' capacitor.config.ts

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify native projects are tracked
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f ios/App/App.xcodeproj/project.pbxproj
          git status --short

      - name: Commit generated native projects and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android ios
          if git diff --cached --quiet; then
            echo "Native projects and lockfile already current."
          else
            git commit -m "build(mobile): materialize Capacitor native projects"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  verify-ios:
    name: Verify Capacitor iOS project
    if: ${{ always() }}
    needs: materialize-native
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web production artifact
        run: npm run build

      - name: Generate iOS native project if missing
        run: if [ ! -d ios ]; then npx cap add ios; fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify Xcode project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -version

      - name: Verify Avenize deep-link scheme
        run: |
          grep -q 'com.avenize.app' ios/App/App/Info.plist
          grep -q 'com.avenize.app' capacitor.config.ts

      - name: Build iOS simulator target
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
