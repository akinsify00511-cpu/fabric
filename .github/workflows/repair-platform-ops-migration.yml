name: Repair platform ops migration

on:
  push:
    branches:
      - feat/ai-capture-attachments-voice

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[platform-ops-repair]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-capture-attachments-voice
          fetch-depth: 1

      - name: Patch invalid aggregate LIMIT syntax
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/migrations/20260818120000_platform_ops_dashboard.sql')
          text = path.read_text(encoding='utf-8')

          old_errors = """      ) ORDER BY captured_at DESC LIMIT 50)\n      FROM platform_error_events\n      WHERE resolved_at IS NULL\n"""
          new_errors = """      ) ORDER BY captured_at DESC)\n      FROM (\n        SELECT id, captured_at, source, source_detail, severity, message, business_id, resolved_at\n        FROM platform_error_events\n        WHERE resolved_at IS NULL\n        ORDER BY captured_at DESC\n        LIMIT 50\n      ) recent_error_rows\n"""

          old_incidents = """      ) ORDER BY opened_at DESC LIMIT 20)\n      FROM platform_incidents\n"""
          new_incidents = """      ) ORDER BY opened_at DESC)\n      FROM (\n        SELECT id, opened_at, closed_at, severity, status, title, summary\n        FROM platform_incidents\n        ORDER BY opened_at DESC\n        LIMIT 20\n      ) recent_incident_rows\n"""

          if text.count(old_errors) != 1:
              raise SystemExit(f'expected exactly one recent_errors target, found {text.count(old_errors)}')
          if text.count(old_incidents) != 1:
              raise SystemExit(f'expected exactly one recent_incidents target, found {text.count(old_incidents)}')

          text = text.replace(old_errors, new_errors)
          text = text.replace(old_incidents, new_incidents)
          path.write_text(text, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -n "LIMIT 50\|LIMIT 20" supabase/migrations/20260818120000_platform_ops_dashboard.sql
          ! grep -n "ORDER BY captured_at DESC LIMIT 50" supabase/migrations/20260818120000_platform_ops_dashboard.sql
          ! grep -n "ORDER BY opened_at DESC LIMIT 20" supabase/migrations/20260818120000_platform_ops_dashboard.sql

      - name: Commit repaired migration and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260818120000_platform_ops_dashboard.sql .github/workflows/repair-platform-ops-migration.yml
          git rm .github/workflows/repair-platform-ops-migration.yml
          git commit -m "fix(db): repair platform ops aggregate limits [platform-ops-repair]"
          git push origin HEAD:feat/ai-capture-attachments-voice
