name: Avenize Operationalization
on:
  push:
    branches: [main, 'fix/continuous-operationalization-*']
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply operational hardening codemods
        if: github.actor != 'github-actions[bot]'
        run: node scripts/operational-hardening-codemod.mjs
      - name: Apply safe lint fixes
        if: github.actor != 'github-actions[bot]'
        run: npx oxlint --fix .
      - name: Persist automated fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: apply automated operational hardening"
            git push
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
