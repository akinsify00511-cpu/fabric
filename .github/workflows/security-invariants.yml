name: Security invariants

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:invariants
