name: UX Tests

on:
  push:
    branches: [main, develop, 'fix/continuous-operationalization-*']

jobs:
  ux-tests:
    name: UX Tests (Desktop)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxOTU3MzQ1MjAwfQ.fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run Playwright UX suite
        run: |
          npx --yes --package=@playwright/test@1.63.0 bash -lc '
            set -euo pipefail
            PW_NODE_MODULES="$(dirname "$(dirname "$(readlink -f "$(command -v playwright)")")")"
            mkdir -p node_modules/@playwright
            ln -sfn "$PW_NODE_MODULES/@playwright/test" node_modules/@playwright/test
            ln -sfn "$PW_NODE_MODULES/playwright" node_modules/playwright
            ln -sfn "$PW_NODE_MODULES/playwright-core" node_modules/playwright-core
            npx playwright install --with-deps chromium webkit
            npx playwright test tests/ux/accessibility.spec.ts
            npx playwright test tests/ux/keyboard-navigation.spec.ts
            npx playwright test tests/ux/error-messages.spec.ts
            npx playwright test tests/ux/tap-targets.spec.ts
            npx playwright test tests/ux/empty-states.spec.ts
            npx playwright test tests/ux/visual-regression.spec.ts
            npx playwright test tests/ux/gap-fill-modules.spec.ts
            npx playwright test tests/ux/module-gate.spec.ts
            npx playwright test tests/ux/auth-matrix.spec.ts
          '

  mobile-ux-tests:
    name: UX Tests (Mobile)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxOTU3MzQ1MjAwfQ.fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run Playwright mobile UX suite
        run: |
          npx --yes --package=@playwright/test@1.63.0 bash -lc '
            set -euo pipefail
            PW_NODE_MODULES="$(dirname "$(dirname "$(readlink -f "$(command -v playwright)")")")"
            mkdir -p node_modules/@playwright
            ln -sfn "$PW_NODE_MODULES/@playwright/test" node_modules/@playwright/test
            ln -sfn "$PW_NODE_MODULES/playwright" node_modules/playwright
            ln -sfn "$PW_NODE_MODULES/playwright-core" node_modules/playwright-core
            npx playwright install --with-deps chromium webkit
            npx playwright test tests/ux/tap-targets.spec.ts --project="Mobile Safari"
          '

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
