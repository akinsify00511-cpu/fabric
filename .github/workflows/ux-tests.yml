name: UX Tests

on:
  push:
    branches: [main, develop, 'fix/continuous-operationalization-*']

jobs:
  ux-tests:
    name: UX Tests (Desktop)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxOTU3MzQ1MjAwfQ.fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright test runner
        run: |
          set -euo pipefail
          rm -rf .ci-playwright
          mkdir -p .ci-playwright node_modules/@playwright/test node_modules/playwright node_modules/playwright-core
          cd .ci-playwright
          npm pack --silent @playwright/test@1.63.0
          npm pack --silent playwright@1.63.0
          npm pack --silent playwright-core@1.63.0
          cd ..
          tar -xzf .ci-playwright/playwright-test-1.63.0.tgz -C node_modules/@playwright/test --strip-components=1
          tar -xzf .ci-playwright/playwright-1.63.0.tgz -C node_modules/playwright --strip-components=1
          tar -xzf .ci-playwright/playwright-core-1.63.0.tgz -C node_modules/playwright-core --strip-components=1
          rm -rf .ci-playwright
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Run accessibility tests
        run: node node_modules/playwright/cli.js test tests/ux/accessibility.spec.ts
      - name: Run keyboard navigation tests
        run: node node_modules/playwright/cli.js test tests/ux/keyboard-navigation.spec.ts
      - name: Run error message tests
        run: node node_modules/playwright/cli.js test tests/ux/error-messages.spec.ts
      - name: Run tap target tests
        run: node node_modules/playwright/cli.js test tests/ux/tap-targets.spec.ts
      - name: Run empty state tests
        run: node node_modules/playwright/cli.js test tests/ux/empty-states.spec.ts
      - name: Run visual regression tests
        run: node node_modules/playwright/cli.js test tests/ux/visual-regression.spec.ts
      - name: Run gap-fill module tests
        run: node node_modules/playwright/cli.js test tests/ux/gap-fill-modules.spec.ts
      - name: Run module gate tests
        run: node node_modules/playwright/cli.js test tests/ux/module-gate.spec.ts
      - name: Run auth launch matrix tests
        run: node node_modules/playwright/cli.js test tests/ux/auth-matrix.spec.ts

  mobile-ux-tests:
    name: UX Tests (Mobile)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxOTU3MzQ1MjAwfQ.fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright test runner
        run: |
          set -euo pipefail
          rm -rf .ci-playwright
          mkdir -p .ci-playwright node_modules/@playwright/test node_modules/playwright node_modules/playwright-core
          cd .ci-playwright
          npm pack --silent @playwright/test@1.63.0
          npm pack --silent playwright@1.63.0
          npm pack --silent playwright-core@1.63.0
          cd ..
          tar -xzf .ci-playwright/playwright-test-1.63.0.tgz -C node_modules/@playwright/test --strip-components=1
          tar -xzf .ci-playwright/playwright-1.63.0.tgz -C node_modules/playwright --strip-components=1
          tar -xzf .ci-playwright/playwright-core-1.63.0.tgz -C node_modules/playwright-core --strip-components=1
          rm -rf .ci-playwright
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Run mobile tap target tests
        run: node node_modules/playwright/cli.js test tests/ux/tap-targets.spec.ts --project="Mobile Safari"

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
