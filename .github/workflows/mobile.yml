name: Build Mobile App (Android + iOS)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  typecheck:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: typecheck
    defaults:
      run:
        working-directory: mobile
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          expo-version: 51.0.28
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: EAS prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build APK
        run: cd android && ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: avenize-android
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Distribute APK to Firebase App Distribution
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_APP_ID_ANDROID != ''
        continue-on-error: true
        run: |
          npx firebase-tools@latest appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID_ANDROID" \
            --token "$FIREBASE_TOKEN" \
            --release-notes "Avenize Android build ${{ github.run_number }} (${{ github.sha }})"

  ios:
    name: iOS Simulator Build
    runs-on: macos-14
    needs: typecheck
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          expo-version: 51.0.28
          packager: npm
      - name: Install dependencies
        run: npm ci
      - name: EAS prebuild (iOS)
        run: npx expo prebuild --platform ios --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build iOS simulator app
        run: |
          cd ios
          pod install
          xcodebuild -workspace Avenize.xcworkspace -scheme Avenize -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: avenize-ios
          path: mobile/ios/build/Build/Products/*.app
          retention-days: 30
