name: Temporary Platform Ops Patch

on:
  push:
    branches:
      - feat/ai-capture-attachments-voice

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger platform ops patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-capture-attachments-voice
          fetch-depth: 0

      - name: Patch invalid jsonb_agg LIMIT syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260818120000_platform_ops_dashboard.sql')
          s = p.read_text()

          old_errors = """    'recent_errors', COALESCE((
      SELECT jsonb_agg(jsonb_build_object(
        'id', id,
        'captured_at', captured_at,
        'source', source,
        'source_detail', source_detail,
        'severity', severity,
        'message', left(message, 300),
        'has_business', business_id IS NOT NULL,
        'resolved_at', resolved_at
      ) ORDER BY captured_at DESC LIMIT 50)
      FROM platform_error_events
      WHERE resolved_at IS NULL
    ), '[]'::jsonb),"""

          new_errors = """    'recent_errors', COALESCE((
      SELECT jsonb_agg(jsonb_build_object(
        'id', id,
        'captured_at', captured_at,
        'source', source,
        'source_detail', source_detail,
        'severity', severity,
        'message', left(message, 300),
        'has_business', business_id IS NOT NULL,
        'resolved_at', resolved_at
      ) ORDER BY captured_at DESC)
      FROM (
        SELECT id, captured_at, source, source_detail, severity, message, business_id, resolved_at
        FROM platform_error_events
        WHERE resolved_at IS NULL
        ORDER BY captured_at DESC
        LIMIT 50
      ) recent_errors
    ), '[]'::jsonb),"""

          old_incidents = """    'recent_incidents', COALESCE((
      SELECT jsonb_agg(jsonb_build_object(
        'id', id,
        'opened_at', opened_at,
        'closed_at', closed_at,
        'severity', severity,
        'status', status,
        'title', title,
        'summary', summary
      ) ORDER BY opened_at DESC LIMIT 20)
      FROM platform_incidents
    ), '[]'::jsonb),"""

          new_incidents = """    'recent_incidents', COALESCE((
      SELECT jsonb_agg(jsonb_build_object(
        'id', id,
        'opened_at', opened_at,
        'closed_at', closed_at,
        'severity', severity,
        'status', status,
        'title', title,
        'summary', summary
      ) ORDER BY opened_at DESC)
      FROM (
        SELECT id, opened_at, closed_at, severity, status, title, summary
        FROM platform_incidents
        ORDER BY opened_at DESC
        LIMIT 20
      ) recent_incidents
    ), '[]'::jsonb),"""

          if old_errors not in s or old_incidents not in s:
              raise SystemExit('Expected platform_ops SQL blocks not found; refusing to modify file')

          s = s.replace(old_errors, new_errors, 1).replace(old_incidents, new_incidents, 1)
          p.write_text(s)
          PY

      - name: Validate migration syntax shape
        run: |
          ! grep -n "jsonb_agg.*LIMIT" supabase/migrations/20260818120000_platform_ops_dashboard.sql

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_patch_platform_ops.yml patch-platform-ops.txt
          git add supabase/migrations/20260818120000_platform_ops_dashboard.sql .github/workflows/_patch_platform_ops.yml patch-platform-ops.txt
          git commit -m "fix(db): correct platform ops aggregate limits"
          git push origin HEAD:feat/ai-capture-attachments-voice
