name: Avenize Control Plane

on:
  push:
    branches: [main, develop, 'fix/continuous-operationalization-*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Unified contract and engineering gate
    runs-on: ubuntu-latest
    env:
      REQUIRE_LIVE: '1'
      APP_URL: https://app.avenize.com
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Hydrate public production verification environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import urllib.request
          from pathlib import Path

          app = os.environ['APP_URL'].rstrip('/')
          html = urllib.request.urlopen(app + '/', timeout=20).read().decode('utf-8', 'replace')
          bundles = re.findall(r'/assets/[A-Za-z0-9_-]+\.js', html)
          if not bundles:
              raise SystemExit('No production JavaScript bundle found at APP_URL')
          js = ''
          for bundle in bundles:
              try:
                  candidate = urllib.request.urlopen(app + bundle, timeout=20).read().decode('utf-8', 'replace')
                  if 'supabase.co' in candidate or 'sb_publishable_' in candidate or 'sb_anon_' in candidate:
                      js = candidate
                      break
              except Exception:
                  continue
          if not js:
              raise SystemExit('Production bundle did not expose public Supabase configuration')
          url_match = re.search(r'https://[0-9a-z]+\.supabase\.co', js)
          key_match = re.search(r'sb_(?:publishable|anon)_[A-Za-z0-9_-]+', js)
          if not url_match or not key_match:
              raise SystemExit('Public Supabase URL/publishable key could not be calibrated from production')
          values = {
              'SUPABASE_URL': url_match.group(0),
              'SUPABASE_KEY': key_match.group(0),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'::add-mask::{value}')
                  out.write(f'{key}={value}\n')
          print('Public production Supabase configuration calibrated from app.avenize.com.')
          PY

      - name: Run Avenize Control Plane
        run: npm run avenize:control-plane

      - name: Upload control-plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avenize-control-plane
          path: governance/reports/control-plane.json
          if-no-files-found: warn
          retention-days: 14
