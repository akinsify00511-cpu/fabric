name: Avenize Control Plane

on:
  push:
    branches: [main, develop, 'fix/continuous-operationalization-*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Unified contract and engineering gate
    runs-on: ubuntu-latest
    env:
      REQUIRE_LIVE: '1'
      APP_URL: https://app.avenize.com
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Hydrate production verification credentials from Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "Vercel deployment credentials are unavailable; relying on dedicated GitHub production credentials."
            exit 0
          fi
          npm i -g vercel
          rm -rf .vercel
          vercel link --yes --project="${VERCEL_PROJECT_ID}" --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"
          vercel env pull .env.production.local --environment=production --yes --token="${VERCEL_TOKEN}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('.env.production.local')
          wanted = {'SUPABASE_SERVICE_ROLE_KEY', 'E2E_EMAIL', 'E2E_PASSWORD', 'SUPABASE_URL', 'SUPABASE_KEY', 'SUPABASE_ANON_KEY'}
          values = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              if key not in wanted:
                  continue
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              if value:
                  values[key] = value
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'::add-mask::{value}')
                  out.write(f'{key}={value}\n')
          print('Production control-plane credentials hydrated from Vercel where configured.')
          PY

      - name: Hydrate public production verification environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import urllib.request

          app = os.environ['APP_URL'].rstrip('/')
          html = urllib.request.urlopen(app + '/', timeout=20).read().decode('utf-8', 'replace')
          bundles = re.findall(r'/assets/[A-Za-z0-9_-]+\.js', html)
          if not bundles:
              raise SystemExit('No production JavaScript bundle found at APP_URL')
          js = ''
          for bundle in bundles:
              try:
                  candidate = urllib.request.urlopen(app + bundle, timeout=20).read().decode('utf-8', 'replace')
                  if 'supabase.co' in candidate or 'sb_publishable_' in candidate or 'sb_anon_' in candidate:
                      js = candidate
                      break
              except Exception:
                  continue
          if not js:
              raise SystemExit('Production bundle did not expose public Supabase configuration')
          url_match = re.search(r'https://[0-9a-z]+\.supabase\.co', js)
          key_match = re.search(r'sb_(?:publishable|anon)_[A-Za-z0-9_-]+', js)
          if not url_match or not key_match:
              raise SystemExit('Public Supabase URL/publishable key could not be calibrated from production')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key, value in {'SUPABASE_URL': url_match.group(0), 'SUPABASE_KEY': key_match.group(0)}.items():
                  print(f'::add-mask::{value}')
                  out.write(f'{key}={value}\n')
          print('Public production Supabase configuration calibrated from app.avenize.com.')
          PY

      - name: Run Avenize Control Plane
        run: npm run avenize:control-plane

      - name: Upload control-plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avenize-control-plane
          path: governance/reports/control-plane.json
          if-no-files-found: warn
          retention-days: 14
