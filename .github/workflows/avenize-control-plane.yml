name: Avenize Control Plane

on:
  push:
    branches: [main, develop, 'fix/continuous-operationalization-*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Unified contract and engineering gate
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      REQUIRE_LIVE: '1'
      APP_URL: https://avenize.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Run Avenize Control Plane
        run: npm run avenize:control-plane

      - name: Upload control-plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avenize-control-plane
          path: governance/reports/control-plane.json
          if-no-files-found: warn
          retention-days: 14
