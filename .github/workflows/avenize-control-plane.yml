name: Avenize Control Plane

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Unified contract and engineering gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - name: Run Avenize Control Plane
        run: npm run avenize:control-plane

      - name: Upload control-plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avenize-control-plane
          path: governance/reports/control-plane.json
          if-no-files-found: warn
          retention-days: 14
