name: One-off upgrade CTA fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: route upgrade CTA to pricing selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix upgrade CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Shell.tsx')
          s = p.read_text()
          old = 'href="/upgrade"'
          new = 'href="/pricing"'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one {old!r}, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-off workflow
        run: rm -f .github/workflows/one-off-fix-upgrade-cta.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Shell.tsx .github/workflows/one-off-fix-upgrade-cta.yml
          git diff --cached --check
          git diff --cached -- src/components/Shell.tsx
          git commit -m 'fix: route upgrade CTA to pricing selection'
          git push
