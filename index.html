  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Avenize - The Business Operating System</title>
    <meta name="title" content="Avenize - The Business Operating System" />
    <meta name="description" content="Unify every business process into one beautifully designed intelligent platform. CRM, Projects, Finance, HR, and AI—all connected. Try Avenize free." />
    <meta name="keywords" content="business operating system, unified business software, all-in-one platform, CRM, project management, HR software, business automation, AI assistant, enterprise software" />
    <meta name="author" content="Avenize, Inc." />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avenize.com/" />
    <meta property="og:title" content="Avenize - The Business Operating System" />
    <meta property="og:description" content="Unify every business process into one beautifully designed intelligent platform." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Avenize" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@avenize" />
    <meta name="twitter:title" content="Avenize - The Business Operating System" />
    <meta name="twitter:description" content="Unify every business process into one beautifully designed intelligent platform." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Avenize" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Avenize" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      /* Critical CSS for fast first paint */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #F7F7F5;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F7F7F5;
        z-index: 9999;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #E8E8E8;
        border-top-color: #4F46E5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err))
        })
      }
      
      // Request notification permission
      if ('Notification' in window && Notification.permission === 'default') {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            Notification.requestPermission()
          }
        })
      }
    </script>
  </body>
</html>
