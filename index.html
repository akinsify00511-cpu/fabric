  <body>
    <div id="root"><div class="loading-screen"><div class="loading-spinner"></div></div></div>
    <script>
      window._removeLoadingScreen = function() { var el = document.querySelector('.loading-screen'); if (el) el.style.display = 'none'; };
      setTimeout(window._removeLoadingScreen, 8000);
      if (document.readyState !== 'loading') window._removeLoadingScreen();

      // Recover automatically from a stale SPA shell. A previous deployment can
      // leave an old HTML shell pointing at hashed bundles that no longer exist.
      // Clear the service-worker/cache layer once, then reload the current shell.
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var message = reason && reason.message ? String(reason.message) : String(reason || '');
        if (!/Failed to fetch dynamically imported module|Importing a module script failed|module script/i.test(message)) return;
        if (sessionStorage.getItem('avenize-stale-shell-recovered') === '1') return;
        sessionStorage.setItem('avenize-stale-shell-recovered', '1');
        var clear = [];
        if ('serviceWorker' in navigator) clear.push(navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
        }));
        if ('caches' in window) clear.push(caches.keys().then(function (names) {
          return Promise.all(names.filter(function (name) { return name.indexOf('avenize-') === 0; }).map(function (name) { return caches.delete(name); }));
        }));
        Promise.all(clear).finally(function () { window.location.reload(); });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var host = window.location.hostname;
        var isAppHost = host === 'app.avenize.com' || host === 'localhost' || host === '127.0.0.1';
        if (!isAppHost) {
          var link = document.createElement('a');
          link.id = 'avenize-download-link';
          link.href = '/download/';
          link.textContent = 'Get the Avenize app';
          document.body.appendChild(link);
          return;
        }
        var manifest = document.createElement('link'); manifest.rel = 'manifest'; manifest.href = '/manifest.json'; document.head.appendChild(manifest);
        var robots = document.querySelector('meta[name="robots"]'); if (robots) robots.setAttribute('content', 'noindex, nofollow');
        var googlebot = document.querySelector('meta[name="googlebot"]'); if (googlebot) googlebot.setAttribute('content', 'noindex, nofollow');
        var canonical = document.querySelector('link[rel="canonical"]'); if (canonical) canonical.setAttribute('href', 'https://app.avenize.com/app');
        if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function (err) { console.log('SW registration failed:', err); }); });
        if ('Notification' in window && Notification.permission === 'default') document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') Notification.requestPermission(); });
      })();
    </script>
