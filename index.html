    <style>
      /* Critical CSS for fast first paint */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #ffffff;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #E8E8E8;
        border-top-color: #4285F4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <!-- Fallback: Remove loading screen if React fails to mount -->
    <script>
      window._removeLoadingScreen = function() {
        var el = document.querySelector('.loading-screen');
        if (el) el.style.display = 'none';
      };
      // Fallback: remove after 8 seconds if React hasn't removed it
      setTimeout(window._removeLoadingScreen, 8000);
      // Remove immediately if DOM is already ready
      if (document.readyState !== 'loading') {
        window._removeLoadingScreen();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('SW registered:', reg.scope)
              // Detect an updated service worker and activate it immediately.
              // sw.js already calls skipWaiting()+clients.claim(), so once the
              // new SW installs, this reload swaps it in without leaving the
              // old bundle active across navigations.
              reg.addEventListener('updatefound', () => {
                const installing = reg.installing
                if (!installing) return
                installing.addEventListener('statechange', () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    // A new SW took over — reload once so the page uses the
                    // new precache + handlers. No infinite loop: after reload
                    // there is no newer 'installed' state to trigger this.
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                      window.location.reload()
                    }, { once: true })
                  }
                })
              })
            })
            .catch((err) => console.log('SW registration failed:', err))
        })
      }
      
      // Request notification permission
      if ('Notification' in window && Notification.permission === 'default') {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            Notification.requestPermission()
          }
        })
      }
    </script>
